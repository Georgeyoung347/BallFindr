# Beta and production releases.
#
# Two ways to release:
#   1. Edit the VERSION file (e.g. 0.1.0-beta.2) and push. The workflow creates
#      the tag v<VERSION> and the release. Pushes that leave VERSION unchanged,
#      or name a version that is already released, do nothing.
#   2. Push a tag like v0.1.0-beta.1 yourself.
# Betas (-beta.N) are published as GitHub pre-releases. The version sets the
# app version on both platforms:
#   versionName / MARKETING_VERSION  <- tag without the leading "v"
#   versionCode / build number       <- MAJOR*1000000 + MINOR*10000 + PATCH*100 + BETA
#                                       (final release uses 99)
#
# Android signing: add these repository secrets for a stable release key.
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks keystore
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key: it installs, but
# each release has a different signature, so testers must uninstall the
# previous beta before installing the next one.
#
# iOS: every release carries an unsigned device IPA (for sideloading tools) and
# the Simulator build. With the IOS_* signing secrets (see the ios-device job) it
# also carries a signed IPA. App Store / TestFlight needs an Apple Developer account.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["VERSION"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      name: ${{ steps.v.outputs.name }}
      short: ${{ steps.v.outputs.short }}
      code: ${{ steps.v.outputs.code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-beta\.([0-9]+))?$ ]]; then
            echo "::error::Version '$tag' must look like v0.1.0 or v0.1.0-beta.1"; exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[3]}; beta=${BASH_REMATCH[5]}
          if [ -n "$beta" ]; then
            if [ "$beta" -lt 1 ] || [ "$beta" -gt 98 ]; then echo "::error::beta number must be 1-98"; exit 1; fi
            seq=$beta; pre=true
          else
            seq=99; pre=false
          fi
          code=$(( major*1000000 + minor*10000 + patch*100 + seq ))
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "short=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "version ${tag#v}, code $code, prerelease $pre"

  android:
    name: Android release APK
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capacitor sync (android)
        run: bunx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BALLFINDR_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set: signing with a throwaway debug key. Testers must uninstall the previous beta before installing this one."
          fi

      - name: Build release APK
        working-directory: android
        env:
          BALLFINDR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BALLFINDR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BALLFINDR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PversionName="${{ needs.version.outputs.name }}" \
            -PversionCode="${{ needs.version.outputs.code }}"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/BallFindr-${{ needs.version.outputs.name }}-android.apk"

      - name: Verify APK version
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt"
          "$aapt" dump badging dist/*.apk | head -n 1
          "$aapt" dump badging dist/*.apk | head -n 1 | grep -q "versionName='${{ needs.version.outputs.name }}'"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS Simulator build
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          major="$(xcodebuild -version | awk 'NR == 1 { print int($2) }')"
          if [ "$major" -lt 26 ]; then
            newest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          fi
          xcodebuild -version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capacitor sync (ios)
        run: bunx cap sync ios

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App -derivedDataPath ios/App/build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/App/build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            MARKETING_VERSION="${{ needs.version.outputs.short }}" \
            CURRENT_PROJECT_VERSION="${{ needs.version.outputs.code }}" \
            build
          app="ios/App/build/Build/Products/Release-iphonesimulator/App.app"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$app/Info.plist"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/BallFindr-${{ needs.version.outputs.name }}-ios-simulator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/*.zip
          if-no-files-found: error

  ios-device:
    name: iOS device IPA
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          major="$(xcodebuild -version | awk 'NR == 1 { print int($2) }')"
          if [ "$major" -lt 26 ]; then
            newest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          fi
          xcodebuild -version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capacitor sync (ios)
        run: bunx cap sync ios

      # Device (arm64) build without signing. The result is packaged as an
      # unsigned IPA that sideloading tools (Sideloadly, AltStore) sign with
      # the installer's own Apple ID.
      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App -derivedDataPath ios/App/build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/App/build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            MARKETING_VERSION="${{ needs.version.outputs.short }}" \
            CURRENT_PROJECT_VERSION="${{ needs.version.outputs.code }}" \
            build
          app="ios/App/build/Build/Products/Release-iphoneos/App.app"
          test -d "$app"
          lipo -info "$app/App"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" "$app/Info.plist"
          rm -rf ipa-unsigned && mkdir -p ipa-unsigned/Payload dist
          ditto "$app" ipa-unsigned/Payload/App.app
          (cd ipa-unsigned && zip -qry "../dist/BallFindr-${{ needs.version.outputs.name }}-ios-unsigned.ipa" Payload)
          unzip -l "dist/BallFindr-${{ needs.version.outputs.name }}-ios-unsigned.ipa" | tail -n 1

      # Signed IPA, only when these repository secrets exist:
      #   IOS_CERTIFICATE_P12_BASE64   base64 of the signing certificate (.p12)
      #   IOS_CERTIFICATE_PASSWORD     its password
      #   IOS_PROVISIONING_PROFILE_BASE64  base64 of the .mobileprovision for
      #                                uk.co.ballfindr.app (ad hoc: installs on
      #                                registered devices; development: on
      #                                registered devices with a dev cert)
      # The unsigned app is re-signed with codesign using the profile's
      # entitlements, which avoids passing provisioning settings to the Swift
      # package targets.
      - name: Sign IPA
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/sign"; mkdir -p "$work"
          kc="$work/signing.keychain-db"; kcpw="$(openssl rand -hex 16)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$P12_BASE64" | base64 --decode > "$work/cert.p12"
          security import "$work/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$kc" | awk 'NR == 1 { print $2 }')"
          test -n "$identity"

          echo "$PROFILE_BASE64" | base64 --decode > "$work/profile.mobileprovision"
          security cms -D -i "$work/profile.mobileprovision" > "$work/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$work/profile.plist" > "$work/entitlements.plist"
          appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$work/profile.plist")"
          echo "Profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$work/profile.plist") ($appid)"
          case "$appid" in
            *.uk.co.ballfindr.app|*.\*) ;;
            *) echo "::error::Provisioning profile is for $appid, not uk.co.ballfindr.app"; exit 1 ;;
          esac

          rm -rf ipa-signed && mkdir -p ipa-signed
          ditto ipa-unsigned/Payload ipa-signed/Payload
          app="ipa-signed/Payload/App.app"
          cp "$work/profile.mobileprovision" "$app/embedded.mobileprovision"
          if [ -d "$app/Frameworks" ]; then
            find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 |
              xargs -0 -I{} codesign --force --sign "$identity" --timestamp=none "{}"
          fi
          codesign --force --sign "$identity" --entitlements "$work/entitlements.plist" --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          (cd ipa-signed && zip -qry "../dist/BallFindr-${{ needs.version.outputs.name }}-ios.ipa" Payload)
          security delete-keychain "$kc"

      - uses: actions/upload-artifact@v4
        with:
          name: release-ios-device
          path: dist/*.ipa
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [version, android, ios, ios-device]
    # Publish the Android beta even if the iOS Simulator build fails.
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        run: |
          cat > notes.md <<NOTES
          BallFindr ${{ needs.version.outputs.name }}

          **Android:** download \`BallFindr-${{ needs.version.outputs.name }}-android.apk\` on the phone, open it, and allow installs from unknown sources if asked. If an earlier BallFindr build is installed and the install fails, uninstall it first.

          **iPhone:** \`BallFindr-${{ needs.version.outputs.name }}-ios-unsigned.ipa\` is not signed. Install it with a sideloading tool such as Sideloadly or AltStore, which signs it with your own Apple ID (a free Apple ID works for 7 days at a time). If a \`BallFindr-${{ needs.version.outputs.name }}-ios.ipa\` is attached, it is signed with the project's provisioning profile and installs on the devices registered in it. App Store and TestFlight builds need an Apple Developer account.

          **iOS Simulator:** \`BallFindr-${{ needs.version.outputs.name }}-ios-simulator.zip\` runs in the Xcode Simulator on a Mac.

          Push notifications are not delivered yet: Firebase (Android) and APNs (iOS) still need to be set up.
          NOTES

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BallFindr ${{ needs.version.outputs.name }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
